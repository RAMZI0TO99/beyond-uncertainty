[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-uncertainty"
version = "0.1.0"
description = "Diagnosing when embodied world models need more data or a different model"
requires-python = ">=3.11"
dependencies = [
    "torch==2.13.0",
    "gymnasium==1.3.0",
    "numpy==2.4.1",
    "scipy==1.17.0",
    "statsmodels==0.14.6",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
